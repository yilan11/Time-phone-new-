<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>APP 名称（请修改）</title>
  <style>
    /* 这些样式只能在独立 HTML 内使用，不要直接复制到小手机主页面。 */
    :root {
      color-scheme: light;
      --page-bg: #faf9f6;
      --text-color: #292733;
      --card-bg: #ffffff;
      --line-color: #dedbe6;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--page-bg); }
    body {
      margin: 0;
      min-width: 0;
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--text-color);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow-wrap: anywhere;
    }
    .app-root { width: 100%; max-width: 720px; margin: 0 auto; padding: 16px; }
    h1 { margin: 0 0 12px; font-size: 24px; line-height: 1.3; }
    p { margin: 0 0 12px; }
    .app-content { min-width: 0; padding: 16px; border: 1px solid var(--line-color); border-radius: 16px; background: var(--card-bg); }
    img, video, canvas, svg { max-width: 100%; }
    img, video { height: auto; }
    input, textarea, select, button { font: inherit; }
    input, textarea, select { min-width: 0; max-width: 100%; }
    textarea { width: 100%; resize: vertical; }
    button { min-height: 44px; padding: 8px 14px; cursor: pointer; }
    button:disabled { cursor: default; }
    :focus-visible { outline: 3px solid #8272b3; outline-offset: 3px; }
    /* 日历或课程表需要多列时，把表格放入这个容器，仅表格区域允许横向滚动。 */
    .table-scroll { max-width: 100%; overflow-x: auto; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app-root">
    <header>
      <h1>APP 名称（请修改）</h1>
    </header>
    <section class="app-content" aria-label="应用内容">
      <!-- 只把用户确认的 APP 页面和功能写在这里。 -->
      <p>这里放你的页面内容。这是空白模板，不是已经接入的小手机 APP。</p>
    </section>
    <p id="app-status" role="status" aria-live="polite"></p>
  </main>
  <script>
    (() => {
      'use strict';
      // 在此编写原生 JavaScript。此空白模板不读写任何数据。
      // 需要保存时，为各 APP 使用不同的键，例如：
      // snowfall-app-tarot-v1 / snowfall-app-calendar-v1 / snowfall-app-timetable-v1
      // 读取、JSON.parse 和写入都必须 try/catch；校验结构后再使用。
      // 数据损坏时保留原数据并停止覆盖；保存失败时提示用户备份。
      // 禁止 localStorage.clear()，禁止访问其他 APP 的存储键。
      // 用 textContent 显示用户输入，避免把不可信文字交给 innerHTML。
      // 返回桌面由小手机外层负责，这里不使用 parent.document、top.location、history.back()。
      // 不添加未经确认的功能、外部接口或自动上传行为。
    })();
  </script>
</body>
</html>
