<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>塔罗抽牌</title>
<style>
:root{
  --bg:#edf0f4; --panel:#ffffff; --panel2:#f4f6fa; --ink:#3d4654; --sub:#8a94a6;
  --line:#dde3ec; --accent:#7c8db0; --accent2:#a493c9; --accent-ink:#ffffff;
  --card1:#e6ecf5; --card2:#c9d4e6; --card3:#cfc6e4; --gold:#b39d6b;
  --shadow:0 8px 24px rgba(90,105,135,.14);
}
:root[data-theme="dark"]{
  --bg:#13161c; --panel:#1d212a; --panel2:#232833; --ink:#e7ebf3; --sub:#8f99ab;
  --line:#2d3342; --accent:#93a7cc; --accent2:#b7a6dd; --accent-ink:#14161c;
  --card1:#2b3242; --card2:#39445c; --card3:#4a4266; --gold:#c9ae7a;
  --shadow:0 8px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,var(--bg),var(--panel2));color:var(--ink);
  font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif;min-height:100dvh}
main{max-width:540px;margin:auto;padding:16px 12px 28px}
header{text-align:center;margin:6px 0 4px}
header h1{font-size:22px;margin:0;letter-spacing:.35em;font-weight:600}
header p{margin:6px 0 0;color:var(--sub);font-size:12px;letter-spacing:.15em}
.daily{display:none;margin:12px auto 0;max-width:460px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:9px 12px;font-size:13px;color:var(--sub);box-shadow:var(--shadow)}
.daily b{color:var(--ink)}
.daily button{float:right;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
  border-radius:8px;padding:4px 10px;font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-top:14px}
label.q{display:block;font-size:12px;color:var(--sub);margin-bottom:6px;letter-spacing:.1em}
#question{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:14px}
.spreads{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.spread{flex:1;min-width:100px;border:1px solid var(--line);background:var(--panel2);color:var(--sub);
  border-radius:12px;padding:9px 4px;font-size:13px;cursor:pointer}
.spread.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.opts{display:flex;align-items:center;gap:14px;margin:10px 2px 0;font-size:13px;color:var(--sub)}
.opts label{display:flex;align-items:center;gap:5px;cursor:pointer}
#drawBtn{width:100%;margin-top:12px;padding:13px;border:0;border-radius:14px;cursor:pointer;
  background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;font-size:16px;letter-spacing:.3em;font-weight:600;
  box-shadow:var(--shadow)}
#drawBtn:disabled{opacity:.55}
.stage{display:flex;gap:10px;justify-content:center;align-items:flex-start;margin-top:18px;min-height:40px;flex-wrap:nowrap}
.slot{flex:0 1 150px;max-width:150px;text-align:center;position:relative}
.unpick{position:absolute;top:-8px;right:-2px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#8a8f96;font-size:13px;line-height:1;cursor:pointer;z-index:3;box-shadow:0 2px 6px rgba(60,60,90,.15);padding:0}
.slot .pos{font-size:12px;color:var(--sub);margin-top:8px;letter-spacing:.2em}
.card3d{perspective:800px;width:100%;aspect-ratio:5/8}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.7,.3,1.2)}
.card3d.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;overflow:hidden}
.back{background:linear-gradient(150deg,var(--card2),var(--card3));border:1px solid var(--line);color:#fff}
.back .moon{font-size:34px;opacity:.9}
.back .pat{font-size:11px;letter-spacing:.4em;margin-top:8px;opacity:.85}
.back::after{content:"";position:absolute;inset:7px;border:1px solid rgba(255,255,255,.5);border-radius:8px}
.front{background:linear-gradient(165deg,var(--card1),var(--card2) 55%,var(--card3));border:1px solid var(--gold);
  transform:rotateY(180deg);color:var(--ink);text-align:center}
.front::after{content:"";position:absolute;inset:6px;border:1px solid rgba(179,157,107,.45);border-radius:8px;pointer-events:none}
.front .roman{font-size:11px;letter-spacing:.25em;color:var(--sub);margin-top:4px}
.front .glyph{font-size:44px;line-height:1.15;margin:6px 0 2px}
.front .glyph.bigchar{font-size:40px;font-family:"Songti SC","STSong",serif;border:1.5px solid var(--gold);border-radius:50%;
  width:64px;height:64px;display:flex;align-items:center;justify-content:center}
.front .cname{font-size:15px;font-weight:700;margin-top:4px}
.front .ename{font-size:9px;color:var(--sub);letter-spacing:.08em;margin-top:2px;text-transform:uppercase}
.front .orient{margin-top:7px;font-size:11px;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--sub)}
.front .orient.rev{color:#b0655f;border-color:#d8a49f}
.art.rev{transform:rotate(180deg)}
.reading{display:none;margin-top:16px}
.reading.show{display:block}
.reading h3,.hist h3{font-size:14px;margin:0 0 10px;letter-spacing:.15em}
.rrow{padding:9px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;font-size:13px;line-height:1.65}
.rrow b{font-size:14px}
.rrow .kw{color:var(--sub)}
#aiBtn{width:100%;padding:11px;border-radius:12px;border:1px solid var(--accent);background:transparent;color:var(--accent);
  font-size:14px;cursor:pointer;margin-top:4px;letter-spacing:.15em}
#aiBtn:disabled{opacity:.55}
#aiOut{display:none;margin-top:10px;padding:12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;
  font-size:14px;line-height:1.8;white-space:pre-wrap}
.status{text-align:center;color:var(--sub);font-size:12px;min-height:18px;margin-top:10px}
.hist{margin-top:16px}
.hrow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;padding:9px 11px;margin-bottom:8px;color:var(--ink);font-size:13px;cursor:pointer}
.hrow .hmeta{color:var(--sub);font-size:11px;white-space:nowrap}
.hrow .hnames{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.clearBtn{border:0;background:transparent;color:var(--sub);font-size:12px;cursor:pointer;float:right}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:10px}
.front.hasart{background:#ffffff;padding:6px}
.front.hasart .art{width:100%;flex:1;display:flex;min-height:0}
.artimg{width:100%;height:100%;object-fit:contain;border-radius:7px;display:block}
.front.hasart .orient{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.9);z-index:2}
.back.hasart{background:#101014;padding:0}
.backimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.back{background:#ffffff;color:#2e3238;border-color:#d9d2c2}
.back::after{border-color:rgba(0,0,0,.13)}
.backsvg{width:74%;height:auto}
#tableArea{position:relative;height:330px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px dashed var(--line);border-radius:14px;overflow:hidden}
.tcard{position:absolute;width:52px;aspect-ratio:5/7.2;background:#fff;border:1px solid #d9d2c2;border-radius:7px;color:#2e3238;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:3px;box-shadow:0 2px 6px rgba(60,60,90,.13)}
.tcard .backsvg{width:82%}
#pickSlots{display:flex;gap:10px;justify-content:center;margin-top:14px}
.emptyslot{width:100%;aspect-ratio:5/8;border:1.5px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px;background:var(--panel2)}
.pickhint{text-align:center;color:var(--sub);font-size:12px;margin-top:12px}
.back{padding:0;background:#fff}
.backimg{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.tcard{padding:0;overflow:hidden}
.callig{writing-mode:vertical-rl;font-family:"Kaiti SC","STKaiti","KaiTi","楷体","Songti SC",serif;font-weight:700;font-size:31px;letter-spacing:.14em;color:#2b2f36;line-height:1.25}
.roman2{font-size:10px;color:var(--sub);letter-spacing:.18em;margin-top:8px}
.verRow{display:flex;gap:8px;margin-bottom:10px}
.verBtn{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--sub);border-radius:10px;padding:7px 4px;font-size:12px;cursor:pointer}
.verBtn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
#arcArea{display:none;position:relative;height:300px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px dashed var(--line);border-radius:14px;overflow:hidden;transition:height .5s}
#arcArea.show{display:block}
#arcArea.mini{height:84px}
#arcFan{position:absolute;inset:0;transform-origin:50% 0;transition:transform .5s}
#arcArea.mini #arcFan{transform:scale(.28)}
.fcard{position:absolute;width:56px;height:80px;left:50%;top:26px;margin-left:-28px;background:#fff;border:1px solid #d9d2c2;border-radius:7px;padding:0;cursor:pointer;transform-origin:50% 330px;box-shadow:0 2px 6px rgba(60,60,90,.15);overflow:hidden}
.fcard img{width:100%;height:100%;object-fit:contain;display:block}
.fcard.taken{filter:brightness(.55)}
.fcard .ord{position:absolute;top:2px;right:2px;width:17px;height:17px;border-radius:50%;background:#b39d6b;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;z-index:2}
.front{background:#ffffff;justify-content:flex-end}
.front::after{display:none}
.front .art{width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:0 2px 2px}
.romantab{margin-top:-10px;min-width:38px;height:22px;border:1.5px solid #c0aa72;border-top:none;border-radius:0 0 22px 22px;color:#8a6d3b;font-family:Georgia,"Times New Roman",serif;font-size:12.5px;font-weight:700;display:flex;align-items:flex-start;justify-content:center;padding:2px 9px 0;letter-spacing:.06em;background:#fff}
.engname{font-family:"Apple Chancery","Snell Roundhand","Brush Script MT","Segoe Script","URW Chancery L",cursive;font-size:13px;line-height:1.3;color:#3a3f47;text-align:center;padding:0 6px 2px;letter-spacing:.02em;max-height:22%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.belowname{margin-top:8px;opacity:0;transform:translateY(4px);transition:opacity .4s,transform .4s}
.slot.revealed .belowname{opacity:1;transform:none}
.belowname .bn{font-size:15px;font-weight:700}
.belowname .be{font-size:9px;color:var(--sub);letter-spacing:.08em;text-transform:uppercase;margin-top:1px}
.slot .pos{margin-top:3px}
.modes{display:flex;gap:8px;margin-top:12px}
.modeBtn{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--sub);border-radius:12px;padding:9px 4px;font-size:13px;cursor:pointer}
.modeBtn.active{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:600}
#fanArea{display:none;margin-top:14px}
#fanArea.show{display:block}
.fanbar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);margin-bottom:10px}
.fanbar .sp{flex:1}
.fanbar button{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer}
#revealBtn{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
#revealBtn:disabled{opacity:.45}
#fanGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;max-height:300px;overflow:auto;padding:2px}
.minicard{position:relative;aspect-ratio:5/7;border-radius:7px;border:1px solid var(--line);cursor:pointer;background:linear-gradient(150deg,var(--card2),var(--card3));color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;padding:0}
.minicard.sel{outline:2px solid var(--gold);outline-offset:1px}
.minicard .ord{position:absolute;top:-6px;right:-6px;width:19px;height:19px;border-radius:50%;background:var(--gold);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}
.assist h3{font-size:14px;margin:0 0 6px;letter-spacing:.15em}
.assist .tip{font-size:12px;color:var(--sub);line-height:1.6;margin:0 0 10px}
.assist input[type=text],.assist textarea{width:100%;padding:10px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:13px;margin-bottom:8px}
.assist textarea{height:64px;resize:vertical}
.abtn{display:inline-block;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:11px;padding:9px 14px;font-size:13px;cursor:pointer;margin:0 6px 8px 0}
.abtn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.abtn:disabled{opacity:.5}
#imgPreview{display:none;width:100%;border-radius:12px;border:1px solid var(--line);margin:4px 0 10px}
#assistStatus{font-size:12px;color:var(--sub);min-height:16px;line-height:1.6}
.csrow{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:8px 11px;font-size:13px;margin-bottom:7px}
.csrow .n{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.csrow button{border:1px solid var(--line);background:var(--panel);color:var(--sub);border-radius:8px;padding:4px 9px;font-size:12px;cursor:pointer}
.interpRow{display:flex;gap:8px;align-items:center;margin:2px 0 10px;flex-wrap:wrap}
.interpRow select{flex:1;min-width:150px;padding:9px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:13px}
#charBox{display:none;flex-direction:column;gap:8px;margin-top:8px}
#charBox.show{display:flex}
#charBox input{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--ink);padding:9px 10px;font-size:13px}
.charLine{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.charLine button{border:1px solid var(--line);background:var(--panel2);color:var(--sub);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer}
#ciRead{border:1px dashed var(--line);background:var(--panel2);color:var(--sub);border-radius:10px;padding:8px;font-size:12.5px;cursor:pointer;width:100%}
#customInterp{display:none;width:100%;gap:8px;flex-wrap:wrap;margin-bottom:10px}
#customInterp.show{display:flex}
#customInterp input{flex:1;min-width:120px;padding:9px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:13px}
</style>
</head>
<body>
<main>
  <header>
    <h1>塔 罗</h1>
    <p>TAROT · 静心提问 · 抽一张牌看看</p>
    <div class="daily" id="dailyBar"><span id="dailyText"></span><button id="dailyView">查看</button></div>
  </header>

  <section class="panel">
    <label class="q" for="question">你想问的事（可不填）</label>
    <input id="question" maxlength="60" placeholder="例如：最近这件事该怎么推进？">
    <div class="spreads" id="spreads">
      <button class="spread active" data-spread="single">单张指引</button>
      <button class="spread" data-spread="time">三张 · 时间流</button>
      <button class="spread" data-spread="situation">三张 · 情境</button>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="allowRev" checked> 允许逆位</label>
      <label><input type="checkbox" id="majorOnly"> 只抽大阿尔卡那</label>
    </div>
    <div class="modes"><button class="modeBtn active" id="modeAuto">随机抽牌</button><button class="modeBtn" id="modePick">摊开自己选</button></div>
    <button id="drawBtn">抽 牌</button>
    <div class="modes" style="margin-top:8px"><button class="modeBtn active" id="flipAuto">自动翻牌</button><button class="modeBtn" id="flipManual">手动翻牌</button></div>
    <div id="fanArea"><div class="fanbar"><span id="fanInfo">在桌面上点选你想要的牌</span><span class="sp"></span><button id="shuffleBtn">重新洗牌</button></div><div class="verRow"><button class="verBtn active" id="ver1">版本1 · 桌面平铺</button><button class="verBtn" id="ver2">版本2 · 横屏扇形</button><button class="verBtn" id="fanRedo" style="display:none;flex:0 1 auto">重新选牌</button></div><div id="tableArea"></div><div id="arcArea"><div id="arcFan"></div></div><div class="pickhint">选好的牌会排到下面 · 点一张翻一张 · 点错了点牌右上角 ✕ 退回桌面</div><div id="pickSlots"></div></div>
    <div class="stage" id="stage"></div>
    <div class="status" id="status"></div>

    <div class="reading" id="reading">
      <h3>牌 面 解 读</h3>
      <div id="rows"></div>
      <div class="interpRow"><select id="interpSel"><option value="standard">正经解读 · 塔罗师</option><option value="char">char 解读（读取小手机角色）</option><option value="custom">自定义角色解读</option></select></div>
      <div id="charBox"><div class="charLine"><span id="charNameLine">当前角色：未读取</span><button id="charReload" type="button">重新读取</button></div><div class="modes" style="margin:2px 0"><button class="modeBtn active" id="charVerSerious" type="button">正经版</button><button class="modeBtn" id="charVerFun" type="button">不正经版</button></div><input id="charStyle" maxlength="40" placeholder="自定义风格（可留空）：填形容词，如 温柔、毒舌、悲观、护短"></div>
      <div id="customInterp"><input id="ciName" maxlength="16" placeholder="角色名，如：毒舌闺蜜"><input id="ciPersona" maxlength="300" placeholder="人设/语气，如：嘴硬心软，说话直来直去"><button id="ciRead" type="button">📥 读取当前 char 填充（小手机数据）</button></div>
      <button id="aiBtn">✦ 开始解读</button>
      <div id="aiOut"></div>
    </div>
  </section>

  <section class="panel assist">
    <h3>AI 小助手 · 导入新牌阵</h3>
    <p class="tip">看到喜欢的牌阵图？选图让 AI 识别它的名称和每个位置的含义，识别成功会自动加进上面的牌阵列表。识别不了也没关系，可以文字描述生成，或手动填写。</p>
    <input type="file" id="imgInput" accept="image/*" hidden>
    <button class="abtn" id="pickImgBtn">选择牌阵图片</button>
    <button class="abtn primary" id="recognizeBtn" disabled>识别图片中的牌阵</button>
    <img id="imgPreview" alt="牌阵图片预览">
    <textarea id="descInput" placeholder="或用文字描述牌阵，例如：五张牌，分别是现状、过去的影响、未来的走向、建议、结果"></textarea>
    <button class="abtn" id="genByTextBtn">用文字生成牌阵</button>
    <input type="text" id="manualName" maxlength="20" placeholder="手动添加：牌阵名称">
    <input type="text" id="manualPos" maxlength="120" placeholder="位置含义，用逗号分隔，如：过去，现在，未来">
    <button class="abtn" id="manualAddBtn">手动添加牌阵</button>
    <div id="assistStatus"></div>
    <div id="customList"></div>
  </section>

  <section class="panel hist">
    <h3>抽 牌 记 录 <button class="clearBtn" id="clearHist">清空</button></h3>
    <div id="histList"><div class="empty">还没有记录</div></div>
  </section>
</main>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const RAIN = (typeof window!=="undefined" && window.rain) ? window.rain : null;

/* ---------- 牌库：22 张大阿尔卡那（罗马数字 / 中文 / 英文 / 符号 / 正位 / 逆位） ---------- */
const MAJOR=[
["0","愚者","The Fool","✦","新开始、自由、冒险、天真","鲁莽、犹豫、冒失、逃避"],
["I","魔术师","The Magician","∞","行动、资源、掌控、创造","操纵、才能未展、欺骗、迟疑"],
["II","女祭司","The High Priestess","☽","直觉、潜意识、神秘、等待","忽视直觉、秘密、表面化、不安"],
["III","皇后","The Empress","❀","丰盛、滋养、美、母性","依赖、停滞、过度付出、创造受阻"],

function buildDeck(){

  const deck=MAJOR.map(m=>({key:"M"+m[0],roman:m[0],cn:m[1],en:m[2],glyph:m[3],big:false,up:m[4],rev:m[5],major:true}));
  SUITS.forEach(s=>RANKS.forEach(r=>{
    deck.push({key:s.en+r[1],roman:RNUM[r[1]]||"",cn:s.cn+r[0],en:r[1]+" of "+s.en,glyph:s.ch,big:true,major:false,

      rev:"受阻或失衡："+r[2]+"难以推进；"+s.flavor+"——"+s.revTail});

  return deck;
}

/* ---------- 牌阵 ---------- */
const SPREADS={
  single:{name:"单张指引",positions:["今日指引"]},
  time:{name:"三张 · 时间流",positions:["过去","现在","未来"]},
  situation:{name:"三张 · 情境",positions:["现状","阻碍","建议"]}
};
let curSpread="single", lastDraw=null, aiBusy=false;
let customSpreads=[];
function getSpread(k){ if(SPREADS[k]) return SPREADS[k]; const c=customSpreads.find(x=>x.id===k); return c||SPREADS.single; }
let pickMode=false, fanDeck=[], pickedIdx=[];

/* ---------- 存储：优先 rain.storage，失败回退 localStorage ---------- */
const store={
  async get(k){ try{ if(RAIN&&RAIN.storage&&RAIN.storage.get){const v=await RAIN.storage.get(k); if(v!==null&&v!==undefined) return v;} }catch(e){}
    try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } },
  async set(k,v){ try{ if(RAIN&&RAIN.storage&&RAIN.storage.set){ await RAIN.storage.set(k,v); return; } }catch(e){}
    try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
function toast(msg){ try{ if(RAIN&&RAIN.toast){ RAIN.toast(msg); return; } }catch(e){} $("status").textContent=msg; }
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* ---------- 主题 ---------- */
function applyTheme(t){ document.documentElement.setAttribute("data-theme", t==="dark"?"dark":"light"); }
try{ if(RAIN&&RAIN.theme) applyTheme(RAIN.theme()); if(RAIN&&RAIN.onTheme) RAIN.onTheme(applyTheme); }catch(e){}

/* ---------- 抽牌 ---------- */
function pickCards(){
  let pool = $("majorOnly").checked ? DECK.filter(c=>c.major) : DECK.slice();
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const n=getSpread(curSpread).positions.length, allowRev=$("allowRev").checked;
  return pool.slice(0,n).map((card,i)=>({card, pos:getSpread(curSpread).positions[i], rev: allowRev && Math.random()<0.3}));
}
const BACKSVG=`<img class="backimg" src="${BACKIMG}" alt="">`;
function cardHTML(d){
  const c=d.card;
  return `<div class="slot"><div class="card3d"><div class="inner">
    <div class="face back">${BACKSVG}</div>
    <div class="face front"><div class="art ${d.rev?"rev":""}">${c.roman?`<div class="romantab">${c.roman}</div>`:"<div></div>"}<div class="engname">${c.en}</div></div></div>
  </div></div><div class="belowname"><div class="bn">${c.cn}</div></div><div class="pos">${d.pos}</div></div>`;
}
function showReading(draw){
  $("rows").innerHTML=draw.map(d=>`<div class="rrow"><b>${d.pos} · ${d.card.cn}</b>（${d.rev?"逆位":"正位"}）<br><span class="kw">${esc(d.rev?d.card.rev:d.card.up)}</span></div>`).join("");
  $("reading").classList.add("show");
  $("aiOut").style.display="none"; $("aiOut").textContent="";
}
function renderDraw(draw,animate){
  $("stage").innerHTML=draw.map(cardHTML).join("");
  const cards=$("stage").querySelectorAll(".card3d");
  cards.forEach((el,i)=>{ setTimeout(()=>{ el.classList.add("flip"); el.closest(".slot").classList.add("revealed"); }, animate? 250+i*350 : 30); });
  showReading(draw);
}
async function saveHistory(draw){
  const hist=(await store.get("tarot_history_v1"))||[];
  hist.unshift({ts:Date.now(), spread:getSpread(curSpread).name, q:$("question").value.trim(),
    cards:draw.map(d=>({key:d.card.key,pos:d.pos,rev:d.rev}))});
  await store.set("tarot_history_v1", hist.slice(0,30));
  renderHistory();
}
async function draw(){
  if(aiBusy) return;
  $("drawBtn").disabled=true; $("status").textContent="洗牌中…";
  await new Promise(r=>setTimeout(r,450));
  lastDraw=pickCards();
  $("status").textContent="";
  $("drawBtn").disabled=false;
  if(flipMode==="manual"){ renderDrawManual(lastDraw); return; }
  renderDraw(lastDraw,true);
  finishDraw(lastDraw);
}
function finishDraw(draw){
  saveHistory(draw);
  if(curSpread==="single"&&draw[0]) store.set("tarot_daily_v1",{date:new Date().toDateString(),key:draw[0].card.key,rev:draw[0].rev});
}
function renderDrawManual(draw){
  $("reading").classList.remove("show");
  $("stage").innerHTML=draw.map(cardHTML).join("");
  $("status").textContent="点每张牌，把它翻开";
  let opened=0;
  $("stage").querySelectorAll(".card3d").forEach(el=>{
    el.style.cursor="pointer";
    el.onclick=()=>{ if(el.classList.contains("flip")) return; el.classList.add("flip"); el.closest(".slot").classList.add("revealed"); opened++;
      if(opened===draw.length){ $("status").textContent=""; showReading(draw); finishDraw(draw); } };
  });
}

/* ---------- AI 解读 ---------- */
async function aiReading(){
  if(!lastDraw||aiBusy) return;
  if(!RAIN||!RAIN.ai){ toast("当前环境没有 AI 解读权限，先看牌面关键词吧"); return; }
  aiBusy=true; $("aiBtn").disabled=true; $("aiBtn").textContent="解读中…";
  const out=$("aiOut"); out.style.display="block"; out.textContent="正在为你解读…";
  try{
    const mode=$("interpSel").value;
    let system="你是一位温和、克制的塔罗解读师。解读要具体、贴近生活，不吓人、不宿命论，最后给一句温和的建议。用中文，分段简洁。";
    if(mode==="char"){
      try{
        const c=RAIN.char?await RAIN.char():null;
        if(c&&c.name){
          const style=$("charStyle").value.trim();
          system=`你是${c.name}。${c.persona||""}\n现在你陪对方看一次塔罗牌阵，全程用你自己的语气、性格和你自己的看法来解读，不要自称AI，不要跳出角色。用中文，分段简洁。`;
          if(charVer==="fun"){ system+=`\n这次用「不正经版」：除了结合牌意，还要大胆加入你基于自己性格的猜想和联想——比如换成你会怎么做、你私下怎么看对方、你的私心、吐槽和调侃都可以带出来，可以稍微跑题，但牌的基本含义不要说反，最后给一句很像你会说的建议。`; }
          else { system+=`\n这次用「正经版」：认真、克制地解读，具体、贴近生活，不吓人、不宿命论，不调侃对方，最后给一句符合你性格的建议。`; }
          if(style){ system+=`\n解读风格请偏向这些词：${style}。让整体语气、关注点和给建议的方向都朝这边靠。`; }
        }
        else toast("没拿到当前角色，先用正经解读啦");
      }catch(e){ toast("没拿到当前角色，先用正经解读啦"); }
    }else if(mode==="custom"){
      const nm=$("ciName").value.trim(), ps=$("ciPersona").value.trim();
      if(nm){ system=`你是${nm}。${ps}\n现在你陪对方看一次塔罗牌阵，全程用这个角色的语气和性格来解读，不要自称AI，不要跳出角色。解读具体、贴近生活，不吓人、不宿命论，最后给一句符合角色性格的建议。用中文，分段简洁。`; }
      else toast("先填个角色名吧，这次先用正经解读");
    }
    const q=$("question").value.trim();
    const lines=lastDraw.map(d=>`${d.pos}：${d.card.cn}（${d.rev?"逆位":"正位"}）— 关键词：${d.rev?d.card.rev:d.card.up}`).join("\n");
    const prompt=`牌阵：${getSpread(curSpread).name}\n提问：${q||"（没有具体问题，请做整体指引）"}\n抽到的牌：\n${lines}\n\n请先总览这副牌的整体氛围，再逐张结合位置简单解读，最后给一句建议。`;
    const text=await RAIN.ai(prompt,{system, max:900});
    out.textContent=text||"（没有拿到解读，再试一次吧）";
  }catch(e){
    out.textContent="解读没成功，可能是 AI 权限还没开，或次数太频繁，稍后再试。";
  }
  aiBusy=false; $("aiBtn").disabled=false; $("aiBtn").textContent="✦ 开始解读";
}

/* ---------- 历史 ---------- */
async function renderHistory(){
  const hist=(await store.get("tarot_history_v1"))||[];
  if(!hist.length){ $("histList").innerHTML='<div class="empty">还没有记录</div>'; return; }
  $("histList").innerHTML=hist.map((h,i)=>{
    const names=h.cards.map(c=>{const card=DECK.find(x=>x.key===c.key);return card?card.cn+"":"?";}).join(" · ");
    const dt=new Date(h.ts); const ds=`${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,"0")}:${String(dt.getMinutes()).padStart(2,"0")}`;
    return `<button class="hrow" data-h="${i}"><span class="hmeta">${ds}</span><span class="hnames">${esc(h.spread)}：${esc(names)}</span></button>`;
  }).join("");
  $("histList").querySelectorAll("[data-h]").forEach(b=>b.onclick=async()=>{
    const hist2=(await store.get("tarot_history_v1"))||[]; const h=hist2[+b.dataset.h]; if(!h) return;
    lastDraw=h.cards.map(c=>{const card=DECK.find(x=>x.key===c.key);return {card,pos:c.pos,rev:c.rev};}).filter(d=>d.card);
    if(lastDraw.length){
      const spreadKey=Object.keys(SPREADS).find(k=>SPREADS[k].name===h.spread);
      const custom=customSpreads.find(s=>s.name===h.spread);
      if(spreadKey||custom) curSpread=spreadKey||custom.id;
      else {
        const restored={id:"history-"+h.ts,name:h.spread||"历史牌阵",positions:lastDraw.map(d=>d.pos)};
        customSpreads.push(restored); curSpread=restored.id;
      }
      renderSpreadButtons();
      $("question").value=h.q||"";
      setPickMode(false);
      renderDraw(lastDraw,false); $("status").textContent="正在查看历史记录";
    }
  });
}

/* ---------- 摊开自选：桌面平铺 → 选牌到底部 → 点翻面 ---------- */
let tableDeck=[], pickedCards=[], fanSeed=1, pickVer=1, fanDone=false;
let flipMode="auto";
let charVer="serious";
function neededCount(){ return getSpread(curSpread).positions.length; }
function startFan(){
  let pool=$("majorOnly").checked?DECK.filter(c=>c.major):DECK.slice();
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  tableDeck=pool; pickedCards=[]; fanSeed=Math.floor(Math.random()*900)+1;
  $("reading").classList.remove("show");
  fanDone=false; $("arcArea").classList.remove("mini"); $("fanRedo").style.display="none";
  renderPickArea(); renderSlots();
}
function renderTable(){
  $("fanInfo").textContent=`在桌面上选 ${neededCount()} 张牌 · 已选 ${pickedCards.length} / ${neededCount()}`;
  const used=new Set(pickedCards.map(p=>p.tidx));
  $("tableArea").innerHTML=tableDeck.map((c,i)=>{
    const x=3+((i*29+fanSeed*7)%82);
    const y=8+Math.floor(i/8)*26+((i*13+fanSeed)%10);
    const r=((i*41+fanSeed)%25)-12;
    return `<button class="tcard" data-t="${i}" style="left:${x}%;top:${y}px;transform:rotate(${r}deg);${used.has(i)?"visibility:hidden":""}">${BACKSVG}</button>`;
  }).join("");
  $("tableArea").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>pickFromDeck(+b.dataset.t));
}
function renderSlots(animIdx){
  const sp=getSpread(curSpread);
  $("pickSlots").innerHTML=sp.positions.map((pos,i)=>{
    const p=pickedCards[i];
    if(!p) return `<div class="slot"><div class="emptyslot">第 ${i+1} 张</div><div class="pos">${pos}</div></div>`;
    return cardHTML({card:p.card,pos,rev:p.rev});
  }).join("");
  $("pickSlots").querySelectorAll(".slot").forEach((slotEl,i)=>{
    const p=pickedCards[i]; if(!p) return;
    const card=slotEl.querySelector(".card3d");
    if(p.flipped){
      if(i===animIdx){ setTimeout(()=>{ card.classList.add("flip"); slotEl.classList.add("revealed"); },40); }
      else { card.classList.add("flip"); slotEl.classList.add("revealed"); }
    } else { card.style.cursor="pointer"; card.onclick=()=>flipPick(i);
      const x=document.createElement("button"); x.className="unpick"; x.textContent="✕"; x.title="点错了，退回桌面";
      x.onclick=(e)=>{ e.stopPropagation(); pickedCards.splice(i,1); afterUnpick(); };
      slotEl.appendChild(x); }
  });
}
function finishPicks(){
  const sp=getSpread(curSpread);
  lastDraw=pickedCards.map((x,j)=>({card:x.card,pos:sp.positions[j],rev:x.rev}));
  setTimeout(()=>{ showReading(lastDraw); saveHistory(lastDraw);
    if(curSpread==="single"&&lastDraw[0]) store.set("tarot_daily_v1",{date:new Date().toDateString(),key:lastDraw[0].card.key,rev:lastDraw[0].rev});
  },650);
}
function autoFlipPicks(){
  let i=0;
  const step=()=>{ if(i>=pickedCards.length) return;
    pickedCards[i].flipped=true; renderSlots(i); i++;
    if(pickedCards.every(x=>x.flipped)) finishPicks(); else setTimeout(step,400);
  };
  setTimeout(step,400);
}
function flipPick(i){
  const p=pickedCards[i]; if(!p||p.flipped) return;
  p.flipped=true; renderSlots(i);
  if(pickedCards.length===neededCount() && pickedCards.every(x=>x.flipped)) finishPicks();
}
function pickFromDeck(i){
  if(pickedCards.length>=neededCount()){ toast("这个牌阵只需要 "+neededCount()+" 张牌，选好的在下面，点一下翻面"); return; }
  pickedCards.push({tidx:i, card:tableDeck[i], rev: $("allowRev").checked && Math.random()<0.3, flipped:false});
  if(pickVer===2 && pickedCards.length>=neededCount()){ fanDone=true; $("arcArea").classList.add("mini"); $("fanRedo").style.display=""; }
  renderPickArea(); renderSlots();
  if(pickedCards.length>=neededCount() && flipMode==="auto") autoFlipPicks();
}
function afterUnpick(){
  if(pickVer===2 && fanDone && pickedCards.length<neededCount()){ fanDone=false; $("arcArea").classList.remove("mini"); $("fanRedo").style.display="none"; }
  renderPickArea(); renderSlots();
}
function renderPickArea(){
  if(pickVer===1){ $("tableArea").style.display=""; $("arcArea").classList.remove("show"); renderTable(); }
  else { $("tableArea").style.display="none"; $("arcArea").classList.add("show"); renderArc(); }
}
function renderArc(){
  $("fanInfo").textContent=`在扇形里选 ${neededCount()} 张牌 · 已选 ${pickedCards.length} / ${neededCount()}`;
  const used=new Map(pickedCards.map((p,idx)=>[p.tidx,idx]));
  const N=tableDeck.length;
  $("arcFan").innerHTML=tableDeck.map((c,i)=>{
    const a=N>1? -72 + i*(144/(N-1)) : 0;
    const ord=used.get(i);
    return `<button class="fcard ${ord!==undefined?"taken":""}" data-a="${i}" style="transform:rotate(${a}deg);z-index:${i}">${ord!==undefined?`<span class="ord">${ord+1}</span>`:""}<img src="${BACKIMG}" alt=""></button>`;
  }).join("");
  $("arcFan").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.a; if(used.has(i)) return; pickFromDeck(i); });
}
$("ver1").onclick=()=>{ pickVer=1; $("ver1").classList.add("active"); $("ver2").classList.remove("active"); renderPickArea(); };
$("ver2").onclick=()=>{ pickVer=2; $("ver2").classList.add("active"); $("ver1").classList.remove("active"); renderPickArea(); };
$("fanRedo").onclick=()=>{ pickedCards=[]; fanDone=false; $("arcArea").classList.remove("mini"); $("fanRedo").style.display="none"; renderPickArea(); renderSlots(); };
function setFlipMode(m){ flipMode=m; $("flipAuto").classList.toggle("active",m==="auto"); $("flipManual").classList.toggle("active",m==="manual"); store.set("tarot_flip_v1",m); }
$("flipAuto").onclick=()=>setFlipMode("auto");
$("flipManual").onclick=()=>setFlipMode("manual");
function setPickMode(on){
  pickMode=on;
  $("modeAuto").classList.toggle("active",!on); $("modePick").classList.toggle("active",on);
  $("drawBtn").style.display=on?"none":""; $("fanArea").classList.toggle("show",on);
  $("stage").style.display=on?"none":"";
  if(on) startFan();
}
$("modeAuto").onclick=()=>setPickMode(false);
$("modePick").onclick=()=>setPickMode(true);
$("shuffleBtn").onclick=startFan;
$("majorOnly").addEventListener("change",()=>{ if(pickMode) startFan(); });

/* ---------- AI 小助手：导入牌阵 ---------- */
let imgData=null;
function parseSpreadJSON(text){
  try{ const s=String(text), a=s.indexOf("{"), b=s.lastIndexOf("}"); if(a<0||b<=a) return null;
    const o=JSON.parse(s.slice(a,b+1));
    if(!o||!Array.isArray(o.positions)) return null;
    const positions=o.positions.map(x=>String(x).trim()).filter(Boolean).slice(0,12);
    if(!positions.length) return null;
    return {name:String(o.name||"自定义牌阵").trim().slice(0,20)||"自定义牌阵", positions};
  }catch(e){ return null; }
}
async function addCustomSpread(name,positions){
  const item={id:"c"+Date.now(), name, positions};
  customSpreads.push(item);
  await store.set("tarot_spreads_v1",customSpreads);
  curSpread=item.id; renderSpreadButtons();
  $("assistStatus").textContent=`已导入牌阵「${name}」，共 ${positions.length} 个位置，已经帮你切换到它了。`;
  toast("新牌阵已导入 · "+name);
}
$("pickImgBtn").onclick=()=>$("imgInput").click();
$("imgInput").addEventListener("change",()=>{
  const f=$("imgInput").files&&$("imgInput").files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ const img=new Image();
    img.onload=()=>{ const cv=document.createElement("canvas"); const sc=Math.min(1, 768/Math.max(img.width,img.height));
      cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      imgData=cv.toDataURL("image/jpeg",0.82);
      $("imgPreview").src=imgData; $("imgPreview").style.display="block"; $("recognizeBtn").disabled=false;
      $("assistStatus").textContent="图片已载入，点「识别图片中的牌阵」试试。";
    };
    img.src=rd.result; };
  rd.readAsDataURL(f);
});
$("recognizeBtn").onclick=async()=>{
  if(!imgData) return;
  if(!RAIN||!RAIN.ai){ $("assistStatus").textContent="当前环境没有 AI 权限，识别不了图片。可以看着图用文字描述生成，或手动填写添加。"; return; }
  $("recognizeBtn").disabled=true; $("assistStatus").textContent="识别中…";
  const ask="这是一张塔罗牌阵图。请识别这个牌阵，严格只输出JSON，不要任何解释文字。格式：{\"name\":\"牌阵名称\",\"positions\":[\"位置1\",\"位置2\"]}。positions按图中顺序填写每个位置的含义；识别不到名称时name填「自定义牌阵」。";
  const sys="你是牌阵识别助手，只输出JSON。";
  const tries=[
    [{role:"user",content:[{type:"text",text:ask},{type:"image_url",image_url:{url:imgData}}]}],
    [{role:"user",content:[{type:"text",text:ask},{type:"image",data:imgData}]}]
  ];
  let done=false;
  for(const t of tries){ try{ const out=await RAIN.ai(t,{system:sys,max:400}); const got=parseSpreadJSON(out); if(got){ await addCustomSpread(got.name,got.positions); done=true; break; } }catch(e){} }
  if(!done) $("assistStatus").textContent="这次没识别成功——当前的 AI 接口可能不支持看图。别急，看着上面的图，用下面的文字描述或手动填写一样能导入。";
  $("recognizeBtn").disabled=false;
};
$("genByTextBtn").onclick=async()=>{
  const desc=$("descInput").value.trim(); if(!desc){ toast("先写一句牌阵描述吧"); return; }
  if(!RAIN||!RAIN.ai){ $("assistStatus").textContent="当前环境没有 AI 权限，文字生成用不了，请用手动填写添加。"; return; }
  $("genByTextBtn").disabled=true; $("assistStatus").textContent="生成中…";
  try{
    const out=await RAIN.ai(`根据这段描述整理出一个塔罗牌阵，严格只输出JSON，不要解释。格式：{"name":"牌阵名称","positions":["位置1","位置2"]}。描述：${desc}`,{system:"你是牌阵整理助手，只输出JSON。",max:400});
    const got=parseSpreadJSON(out);
    if(got) await addCustomSpread(got.name,got.positions);
    else $("assistStatus").textContent="没整理出来，换个更具体的描述试试，或用手动填写。";
  }catch(e){ $("assistStatus").textContent="生成失败，稍后再试，或用手动填写添加。"; }
  $("genByTextBtn").disabled=false;
};
$("manualAddBtn").onclick=async()=>{
  const name=$("manualName").value.trim();
  const positions=$("manualPos").value.split(/[,，、\/\n]/).map(x=>x.trim()).filter(Boolean).slice(0,12);
  if(!name){ toast("先给牌阵起个名字吧"); return; }
  if(!positions.length){ toast("至少写一个位置含义吧"); return; }
  await addCustomSpread(name,positions);
  $("manualName").value=""; $("manualPos").value="";
};

/* ---------- 解读人设置 ---------- */
function bindInterp(){
  const sel=$("interpSel");
  const sync=()=>{ $("customInterp").classList.toggle("show", sel.value==="custom"); $("charBox").classList.toggle("show", sel.value==="char"); store.set("tarot_interp_v1",{mode:sel.value,name:$("ciName").value,persona:$("ciPersona").value,charVer,charStyle:$("charStyle").value}); if(sel.value==="char") loadCharName(); };
  sel.onchange=sync; $("ciName").addEventListener("change",sync); $("ciPersona").addEventListener("change",sync); $("charStyle").addEventListener("change",sync);
  const setCharVer=v=>{ charVer=v; $("charVerSerious").classList.toggle("active",v==="serious"); $("charVerFun").classList.toggle("active",v==="fun"); sync(); };
  $("charVerSerious").onclick=()=>setCharVer("serious"); $("charVerFun").onclick=()=>setCharVer("fun");
  async function loadCharName(){ const el=$("charNameLine"); try{ const c=(RAIN&&RAIN.char)?await RAIN.char():null; el.textContent=c&&c.name?("当前角色："+c.name):"当前角色：没读到（可能没开权限）"; }catch(e){ el.textContent="当前角色：读取失败"; } }
  $("charReload").onclick=loadCharName;
  $("ciRead").onclick=async()=>{ try{ const c=(RAIN&&RAIN.char)?await RAIN.char():null; if(c&&c.name){ $("ciName").value=c.name.slice(0,16); $("ciPersona").value=(c.persona||"").slice(0,300); sync(); toast("已把当前 char 填进来，可以再改"); } else toast("没读到当前角色"); }catch(e){ toast("读取失败，可能没开权限"); } };
  store.get("tarot_interp_v1").then(v=>{ if(v){ sel.value=v.mode||"standard"; $("ciName").value=v.name||""; $("ciPersona").value=v.persona||""; $("charStyle").value=v.charStyle||""; charVer=v.charVer||"serious"; $("charVerSerious").classList.toggle("active",charVer==="serious"); $("charVerFun").classList.toggle("active",charVer==="fun"); $("customInterp").classList.toggle("show", sel.value==="custom"); $("charBox").classList.toggle("show", sel.value==="char"); if(sel.value==="char") loadCharName(); } });
}

/* ---------- 初始化 ---------- */
function renderSpreadButtons(){
  const box=$("spreads"); box.innerHTML="";
  Object.keys(SPREADS).concat(customSpreads.map(c=>c.id)).forEach(k=>{
    const b=document.createElement("button");
    b.className="spread"+(k===curSpread?" active":""); b.dataset.spread=k; b.textContent=getSpread(k).name;
    b.onclick=()=>{ curSpread=k; renderSpreadButtons(); if(pickMode) startFan(); };
    box.appendChild(b);
  });
  renderCustomList();
}
function renderCustomList(){
  const box=$("customList"); if(!box) return;
  box.innerHTML=customSpreads.map(c=>`<div class="csrow"><span class="n">${esc(c.name)}（${c.positions.length}张）</span><button data-delcs="${c.id}">删除</button></div>`).join("");
  box.querySelectorAll("[data-delcs]").forEach(b=>b.onclick=async()=>{
    customSpreads=customSpreads.filter(x=>x.id!==b.dataset.delcs);
    if(curSpread===b.dataset.delcs) curSpread="single";
    await store.set("tarot_spreads_v1",customSpreads); renderSpreadButtons(); toast("牌阵已删除");
  });
}
$("drawBtn").onclick=draw;
(async()=>{ const fm=await store.get("tarot_flip_v1"); if(fm==="manual") setFlipMode("manual"); })();
$("aiBtn").onclick=aiReading;
$("clearHist").onclick=async()=>{ await store.set("tarot_history_v1",[]); renderHistory(); toast("记录已清空"); };
(async()=>{
  customSpreads=(await store.get("tarot_spreads_v1"))||[];
  renderSpreadButtons(); bindInterp();
  renderHistory();
  const daily=await store.get("tarot_daily_v1");
  if(daily&&daily.date===new Date().toDateString()){
    const card=DECK.find(x=>x.key===daily.key);
    if(card){ $("dailyText").innerHTML=`今日指引已抽：<b>${card.cn}</b>（${daily.rev?"逆位":"正位"}）`;
      $("dailyBar").style.display="block";
      $("dailyView").onclick=()=>{ lastDraw=[{card,pos:"今日指引",rev:daily.rev}]; renderDraw(lastDraw,false); };
    }
  }
})();
})();
</script>
