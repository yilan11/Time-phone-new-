<div class="dc" id="dc">
  <div class="box">
    <svg class="wave" viewBox="0 0 100 100" preserveAspectRatio="none">
      <path d="M2,96 C20,100 42,84 52,62 C58,48 56,34 50,32 C45,31 44,38 49,40 C58,42 66,26 74,14 C80,6 86,2 96,4" />
    </svg>

    <label class="tall">
      <span class="ph" data-k="dcImg1"><input type="file" accept="image/*"><i>+</i></span>
    </label>

    <label class="sq">
      <span class="dia" data-k="dcImg2"><input type="file" accept="image/*"><i>+</i></span>
    </label>

    <div class="mini"></div>
  </div>
</div>

<style>
  .dc {
    --line: #555;      /* 所有线条颜色 */
    --paper: #fff;     /* 卡片底色 */
    width: 100%;
    height: 100%;
    min-height: 150px;
    box-sizing: border-box;
    padding: 4%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dc .box {
    position: relative;
    height: 100%;
    max-width: 100%;
    aspect-ratio: 1 / 1;
  }
  .dc .wave {
    position: absolute;
    left: 0; top: 2%;
    width: 46%; height: 44%;
    overflow: visible;
  }
  .dc .wave path {
    fill: none;
    stroke: var(--line);
    stroke-width: 1.2;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }
  .dc .tall {
    position: absolute;
    left: 42%; top: 10%;
    width: 38%; height: 64%;
    background: var(--paper);
    border: 1.5px solid var(--line);
    box-sizing: border-box;
    padding: 8% 0;
    transform: rotate(13deg);
    cursor: pointer;
    display: block;
  }
  .dc .tall .ph {
    display: flex;
    width: 100%; height: 100%;
    border-top: 1.5px solid var(--line);
    border-bottom: 1.5px solid var(--line);
    box-sizing: border-box;
  }
  .dc .sq {
    position: absolute;
    left: 8%; top: 40%;
    width: 42%;
    aspect-ratio: 1 / 1.08;
    background: var(--paper);
    border: 1.5px solid var(--line);
    box-sizing: border-box;
    transform: rotate(-9deg);
    cursor: pointer;
    display: block;
    z-index: 2;
  }
  .dc .sq::before {          /* 菱形外框线 */
    content: "";
    position: absolute;
    inset: 0;
    background: var(--line);
    clip-path: polygon(50% 3%, 97% 46%, 52% 97%, 3% 50%, 50% 3%, 50% 5.2%, 5.6% 50%, 52% 94.6%, 94.4% 46%, 50% 5.2%);
  }
  .dc .dia {
    position: absolute;
    inset: 0;
    clip-path: polygon(50% 5.2%, 94.4% 46%, 52% 94.6%, 5.6% 50%);
  }
  .dc .ph, .dc .dia {
    align-items: center;
    justify-content: center;
    display: flex;
    background: transparent center / cover no-repeat;
  }
  .dc input { display: none; }
  .dc i { font-style: normal; color: #bbb; font-size: 18px; }
  .dc .has i { display: none; }
  .dc .mini {
    position: absolute;
    left: 64%; top: 82%;
    width: 7%;
    aspect-ratio: 1 / 1;
    border: 1.5px solid var(--line);
    box-sizing: border-box;
    transform: rotate(-16deg);
  }
</style>

<script>
  (function () {
    var root = document.getElementById('dc');
    function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

    // 长框和菱形：点击导入图片，裁切后保存
    root.querySelectorAll('[data-k]').forEach(function (el) {
      var input = el.querySelector('input');
      var k = el.dataset.k;
      var saved = load(k);
      if (saved) { el.style.backgroundImage = 'url(' + saved + ')'; el.classList.add('has'); }
      input.addEventListener('change', function () {
        var f = input.files && input.files[0];
        if (!f) return;
        var reader = new FileReader(), img = new Image();
        reader.onload = function () { img.src = reader.result; };
        img.onload = function () {
          var W = 400, H = el.classList.contains('dia') ? 400 : 520, r = W / H;
          var sw = img.width, sh = img.height;
          if (sw / sh > r) { sw = sh * r; } else { sh = sw / r; }
          var c = document.createElement('canvas');
          c.width = W; c.height = H;
          c.getContext('2d').drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, W, H);
          var url = c.toDataURL('image/jpeg', 0.85);
          el.style.backgroundImage = 'url(' + url + ')';
          el.classList.add('has');
          save(k, url);
        };
        reader.readAsDataURL(f);
      });
    });
  })();
</script>
