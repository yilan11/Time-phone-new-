<div class="dc">
  <!-- 右边竖框里的照片 -->
  <label class="photo b" data-k="dcImg2"><input type="file" accept="image/*"></label>
  <!-- 左边方框的白底（挡住后面的竖框） -->
  <span class="sq"></span>
  <!-- 菱形里的照片 -->
  <label class="photo a" data-k="dcImg1"><input type="file" accept="image/*"></label>
  <!-- 你画的线稿 -->
  <img class="art" src="https://yilan11.github.io/Time-phone-new-/snowfall-assets/line-art/dc.png" alt="">
</div>

<style>
  .dc {
    --paper: #fff;        /* 方框底色 */
    aspect-ratio: 530 / 620;
    position: relative;
    width: 100%;
    max-height: 100%;
    margin: auto;
    overflow: hidden;
    container-type: inline-size;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .dc .art { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
  .dc .photo { position: absolute; display: block; background: center / cover no-repeat; cursor: pointer; z-index: 1; }
  .dc .photo input { display: none; }
  .dc .photo.b { left:40.75%;top:21.61%;width:51.89%;height:53.39%;clip-path:polygon(21.8% 0.0%,100.0% 14.2%,78.5% 100.0%,0.0% 85.5%); }
  .dc .sq { position: absolute; z-index: 2; background: var(--paper); left:10.19%;top:51.61%;width:46.79%;height:44.19%;clip-path:polygon(0.0% 12.8%,83.9% 0.0%,100.0% 87.2%,16.1% 100.0%); }
  .dc .photo.a { z-index: 2; left:14.15%;top:54.68%;width:38.87%;height:38.39%;clip-path:polygon(43.7% 0.0%,100.0% 40.8%,58.3% 100.0%,0.0% 55.5%); }
</style>

<script>
  (function () {
    var me = document.currentScript;
    var root = (me && me.previousElementSibling && me.previousElementSibling.previousElementSibling) || document.querySelector('.dc');
    function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

    // 文字：点击修改，自动保存；回车结束编辑；粘贴只保留纯文字
    root.querySelectorAll('[contenteditable]').forEach(function (el) {
      var v = load(el.dataset.k);
      if (v !== null && v !== '') el.textContent = v;
      el.addEventListener('input', function () { save(el.dataset.k, el.textContent); });
      el.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } });
      el.addEventListener('paste', function (e) {
        e.preventDefault();
        var t = (e.clipboardData || window.clipboardData).getData('text').replace(/\s+/g, ' ');
        document.execCommand('insertText', false, t);
      });
    });

    // 照片：点击导入；1MB 以内存原图，更大的按比例缩小（最长边 1200）
    root.querySelectorAll('.photo').forEach(function (ph) {
      var input = ph.querySelector('input'), k = ph.dataset.k, saved = load(k);
      if (saved) ph.style.backgroundImage = 'url(' + saved + ')';
      function show(url) { ph.style.backgroundImage = 'url(' + url + ')'; save(k, url); }
      input.addEventListener('change', function () {
        var f = input.files && input.files[0];
        if (!f) return;
        var reader = new FileReader();
        reader.onload = function () {
          if (f.size <= 1024 * 1024) { show(reader.result); return; }
          var img = new Image();
          img.onload = function () {
            var s = Math.min(1, 1200 / Math.max(img.width, img.height));
            var c = document.createElement('canvas');
            c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            show(c.toDataURL('image/jpeg', 0.92));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(f);
      });
    });
  })();
</script>
