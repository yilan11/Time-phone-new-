<div class="nt" id="nt">
  <div class="paper">
    <span class="tape"></span>
    <div class="say" contenteditable="true" data-k="ntText">今天也要好好吃饭</div>
    <div class="foot">
      <svg viewBox="0 0 40 12" class="tiny"><path d="M1,8 C6,2 10,2 13,6 C15,9 17,4 20,4 C23,4 23,8 20,9 C18,10 18,6 22,6 C27,6 31,10 39,6" /></svg>
      <span id="ntDate"></span>
    </div>
  </div>
</div>

<style>
  .nt {
    --line: #555;      /* 线条颜色 */
    --ink: #555;       /* 字的颜色 */
    --paper: #fff;     /* 便签底色 */
    width: 100%;
    height: 100%;
    min-height: 100px;
    box-sizing: border-box;
    padding: 7% 6% 5%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .nt .paper {
    position: relative;
    width: 100%;
    height: 100%;
    background: var(--paper);
    border: 1.3px solid var(--line);
    box-sizing: border-box;
    padding: 9% 8% 6%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transform: rotate(-2deg);
  }
  .nt .tape {                    /* 顶上的胶带 */
    position: absolute;
    left: 50%; top: -8px;
    width: 26%; height: 14px;
    margin-left: -13%;
    border: 1.2px solid var(--line);
    background: var(--paper);
    transform: rotate(4deg);
    box-sizing: border-box;
  }
  .nt .say {
    color: var(--ink);
    font-size: clamp(12px, 4vw, 20px);
    line-height: 1.6;
    letter-spacing: .12em;
    outline: none;
    overflow: hidden;
    background: repeating-linear-gradient(transparent 0 calc(1.6em - 1px), #cfcfcf calc(1.6em - 1px) 1.6em);
  }
  .nt .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--ink);
    font-size: clamp(9px, 2.6vw, 12px);
    letter-spacing: .15em;
  }
  .nt .tiny { width: 26%; max-width: 60px; }
  .nt .tiny path {
    fill: none;
    stroke: var(--line);
    stroke-width: 1.2;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }
</style>

<script>
  (function () {
    var root = document.getElementById('nt');
    function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

    // 点字就能改，自动保存
    var say = root.querySelector('.say'), v = load('ntText');
    if (v) say.innerText = v;
    say.addEventListener('input', function () { save('ntText', say.innerText); });

    var d = new Date();
    document.getElementById('ntDate').textContent = d.getFullYear() + '.' + (d.getMonth() + 1) + '.' + d.getDate();
  })();
</script>
