<div class="wk" id="wk">
  <div class="top">
    <span class="title" contenteditable="true" data-k="wkTitle">早睡打卡</span>
    <span class="count" id="wkCount">0 / 7</span>
  </div>
  <div class="row" id="wkRow"></div>
</div>

<style>
  .wk {
    --line: #555;      /* 线条颜色 */
    --ink: #555;       /* 字的颜色 */
    width: 100%;
    height: 100%;
    min-height: 90px;
    box-sizing: border-box;
    padding: 6% 7%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14%;
    color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wk .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1.2px solid var(--line);
    padding-bottom: 4px;
  }
  .wk .title {
    font-size: clamp(11px, 3.4vw, 16px);
    letter-spacing: .25em;
    outline: none;
  }
  .wk .count { font-size: clamp(10px, 3vw, 13px); letter-spacing: .1em; }
  .wk .row {
    display: flex;
    justify-content: space-between;
  }
  .wk .day {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    width: 12%;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .wk .day b {
    font-weight: 400;
    font-size: clamp(9px, 2.6vw, 12px);
  }
  .wk .dot {
    width: 100%;
    max-width: 26px;
    aspect-ratio: 1 / 1;
    border: 1.2px solid var(--line);
    border-radius: 50%;
    box-sizing: border-box;
    position: relative;
    transition: background .12s;
  }
  .wk .on .dot::after {          /* 打勾 */
    content: "";
    position: absolute;
    left: 32%; top: 22%;
    width: 26%; height: 42%;
    border: solid var(--line);
    border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg);
  }
  .wk .today b { border-bottom: 1.2px solid var(--line); }
</style>

<script>
  (function () {
    var root = document.getElementById('wk');
    function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

    // 标题可改
    var t = root.querySelector('.title'), tv = load('wkTitle');
    if (tv) t.innerText = tv;
    t.addEventListener('input', function () { save('wkTitle', t.innerText); });
    t.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); t.blur(); } });

    // 本周一的日期当作这周的编号，换周自动清空
    var now = new Date(), wd = (now.getDay() + 6) % 7;
    var mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - wd);
    var weekKey = 'wkDone-' + mon.getFullYear() + '-' + (mon.getMonth() + 1) + '-' + mon.getDate();
    var done = (load(weekKey) || '0000000').split('');
    var names = ['一', '二', '三', '四', '五', '六', '日'], row = document.getElementById('wkRow');

    function count() {
      document.getElementById('wkCount').textContent = done.filter(function (x) { return x === '1'; }).length + ' / 7';
    }
    names.forEach(function (n, i) {
      var d = document.createElement('div');
      d.className = 'day' + (done[i] === '1' ? ' on' : '') + (i === wd ? ' today' : '');
      d.innerHTML = '<span class="dot"></span><b>' + n + '</b>';
      d.addEventListener('click', function () {
        done[i] = done[i] === '1' ? '0' : '1';
        d.classList.toggle('on', done[i] === '1');
        save(weekKey, done.join(''));
        count();
      });
      row.appendChild(d);
    });
    count();
  })();
</script>
