<div class="lc" id="lc">
  <svg class="face" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="46" class="ring" />
    <g class="ticks"></g>
    <line class="h" x1="50" y1="50" x2="50" y2="28" />
    <line class="m" x1="50" y1="50" x2="50" y2="16" />
    <circle cx="50" cy="50" r="1.8" class="dot" />
  </svg>
  <div class="txt">
    <div class="time" id="lcTime">00:00</div>
    <div class="date" id="lcDate">—</div>
  </div>
</div>

<style>
  .lc {
    --line: #555;      /* 线条颜色 */
    --ink: #555;       /* 字的颜色 */
    width: 100%;
    height: 100%;
    min-height: 100px;
    box-sizing: border-box;
    padding: 6%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8%;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .lc .face {
    height: 100%;
    max-height: 100%;
    aspect-ratio: 1 / 1;
    flex: 0 0 auto;
    max-width: 50%;
  }
  .lc .ring, .lc line {
    fill: none;
    stroke: var(--line);
    stroke-width: 1.2;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }
  .lc .h { stroke-width: 2; }
  .lc .dot { fill: var(--line); }
  .lc .txt { color: var(--ink); }
  .lc .time {
    font-size: clamp(18px, 8vw, 40px);
    font-weight: 300;
    letter-spacing: .06em;
    line-height: 1.1;
  }
  .lc .date {
    margin-top: 6px;
    padding-top: 4px;
    border-top: 1.2px solid var(--line);
    font-size: clamp(10px, 3vw, 14px);
    letter-spacing: .2em;
  }
</style>

<script>
  (function () {
    var root = document.getElementById('lc');
    var ticks = root.querySelector('.ticks'), ns = 'http://www.w3.org/2000/svg';
    for (var i = 0; i < 12; i++) {             // 12 个刻度
      var a = i * Math.PI / 6, l = document.createElementNS(ns, 'line'), r1 = i % 3 ? 41 : 38;
      l.setAttribute('x1', 50 + Math.sin(a) * r1); l.setAttribute('y1', 50 - Math.cos(a) * r1);
      l.setAttribute('x2', 50 + Math.sin(a) * 44); l.setAttribute('y2', 50 - Math.cos(a) * 44);
      ticks.appendChild(l);
    }
    var h = root.querySelector('.h'), m = root.querySelector('.m');
    var week = ['日', '一', '二', '三', '四', '五', '六'];
    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function tick() {
      var d = new Date(), hh = d.getHours(), mm = d.getMinutes();
      h.setAttribute('transform', 'rotate(' + ((hh % 12) * 30 + mm / 2) + ' 50 50)');
      m.setAttribute('transform', 'rotate(' + (mm * 6) + ' 50 50)');
      document.getElementById('lcTime').textContent = pad(hh) + ':' + pad(mm);
      document.getElementById('lcDate').textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日 周' + week[d.getDay()];
    }
    tick();
    setInterval(tick, 10000);
  })();
</script>
