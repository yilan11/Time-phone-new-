orm:translateX(-50%);background:#4a456e;color:white;padding:10px 16px;border-radius:24px;font-size:13px;z-index:50;box-shadow:0 8px 24px #0002;max-width:90%;text-align:center}.hidden{display:none!important}.backrow{display:flex;align-items:center;gap:8px;margin-bottom:12px}.back{border:0;background:none;color:var(--deep);font-size:16px}.fileitem{border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:13px;margin-bottom:9px;display:flex;align-items:center;gap:10px}.fileitem .name{flex:1}.fileitem small{color:var(--sub);display:block;margin-top:3px}.switcher{display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:10px 0}.switcher button{flex:1;padding:10px;border:0;background:transparent;color:var(--sub)}.switcher button.active{background:var(--soft);color:var(--deep);font-weight:700}.loading{opacity:.6;pointer-events:none}.blanknote{text-align:center;color:var(--sub);padding:24px 10px;font-size:13px}.divider{height:1px;background:var(--line);margin:15px 0}

e;padding-top:28px}.kkBubble .copyGen{position:absolute;right:8px;top:5px;border:0;background:transparent;color:#ddd;font-size:12px}.kkInputBar{border-top:1px solid var(--line);padding:10px 0 0;display:flex;flex-direction:column;gap:8px}.kkInputBar textarea{min-height:58px;max-height:150px}.kkAttachRow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.kkAttach{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:10px;padding:5px 8px}.kkSendRow{display:flex;gap:8px;align-items:center}.kkSendRow .primary{padding:0 18px;height:42px}.kkFormat{font-size:12px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}.kkImgPreview{max-width:100%;max-height:140px;border-radius:12px;margin-top:8px}.kkUserAvatar{background:#ddd;color:#555;display:grid;place-items:center;font-size:16px}.errorDetails{border:1px solid #d9c5c5;background:rgba(180,90,90,.06);border-radius:14px;padding:12px;margin-top:10px;font-size:12px;line-height:1.65;color:var(--ink)}.stopbtn{border:1px solid #aaa;border-radius:12px;padding:7px 12px;background:transparent;color:var(--ink)}.reader .readerbody{padding-bottom:30px}.readerTools{display:flex;gap:8px}
@keyframes up{from{transform:translateY(15px);opacity:.6}to{transform:none;opacity:1}}

/* KK compact chat and avatar styling */
.kkHead{padding:4px 0 8px;margin-bottom:5px}.kkAvatar{width:34px;height:34px}.kkAvatarWrap{width:34px;height:34px;flex-shrink:0}.kkButterfly{position:absolute;right:-3px;top:-5px;color:#fff;font-size:13px;line-height:1;text-shadow:0 1px 2px rgba(80,80,80,.55);z-index:2;pointer-events:none}.kkMsgs{gap:9px;padding:4px 0 8px;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}.kkBubble{max-width:78%;padding:8px 10px;font-size:12.5px;line-height:1.58}.kkBubble.generated{background:#424246;color:#f4f4f5;border:1px solid #5a5a60;border-radius:15px;padding:12px 11px 10px;position:relative;max-width:92%;font-size:12px;line-height:1.6}.kkInputBar{padding:8px;border-radius:16px;flex-shrink:0;position:sticky;bottom:0;background:var(--bg);box-shadow:0 -8px 18px rgba(20,20,20,.035)}.kkInputBar textarea{min-height:68px;max-height:130px;font-size:13px}.kkSendRow{gap:7px}.kkSendRow button{min-height:36px;padding:7px 12px}.kkFormat{width:100%;max-width:100%;min-width:0;font-size:12px}.kkAvatarPick{border:0;background:transparent;padding:0;cursor:pointer;display:inline-flex;position:relative;width:34px;height:34px}.kkAvatarPick .kkAvatar{display:block}.kkUserAvatar{display:grid;place-items:center;background:var(--soft);color:var(--deep);font-weight:700}

<body><div class="app" id="app">
<header class="top"><div class="brand">小剧场 <span style="color:var(--purple)">✦</span><small>EXTRA STORY STUDIO</small></div><button class="iconbtn" id="plus" title="新建素材">＋</button></header>
<main class="view" id="view"></main>
<footer class="bottom"><div class="pageDots" id="pageDots"><i data-dot="library"></i><i data-dot="generated"></i><i data-dot="assistant"></i></div><div class="bottomControls"><button class="round" id="libraryBtn" title="素材库">▣</button><button class="primary generate" id="generateBtn">✦　生成</button><button class="round" id="themeBtn" title="切换主题">☾</button></div></footer>
<div id="modalRoot"></div><div id="toastRoot"></div>

<script>
/* 雪落机适配层：把原来雪落机的 window.rain 接口接到雪落机。
   AI = 设置里的「文字 API」；角色 = 通讯里的角色；user = 设置里的个人资料。 */
(function(){
const host=(()=>{try{return window.parent!==window?window.parent:null}catch{return null}})();
const jget=k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}};
function apiCfg(){let c=null;try{c=host&&host.snowApi&&host.snowApi()}catch{}if(!c)c=jget('little-phone-api-v1');return c||{}}
function comm(){let c=null;try{c=host&&host.comm}catch{}return c||jget('little-phone-communications-v1')||{contacts:[],profile:{}}}
const CHAR_KEY='snowfall-theater-char-v1';
function contacts(){return (comm().contacts||[]).map(c=>({id:c.id,name:c.name,persona:c.persona||'',avatar:c.avatar||''}))}
async function ai(input,opt={}){
  const c=apiCfg();
  if(!c.enabled||!c.base||!c.model)throw new Error('还没有连接 AI。请回到桌面打开「设置 → 文字 API」，填好并点「保存」。');
  if(!c.key)throw new Error('文字 API 的 key 没有保存（刷新后需要重新填写）。请到「设置 → 文字 API」重新填写并保存，或勾选「在本机记住密钥」。');
  const endpoint=c.base.endsWith('/chat/completions')?c.base:c.base.replace(/\/+$/,'')+'/chat/completions';
  const msgs=[];if(opt.system)msgs.push({role:'system',content:opt.system});
  if(Array.isArray(input))input.forEach(m=>msgs.push({role:m.role==='assistant'?'assistant':m.role==='system'?'system':'user',content:String(m.content||'')}));else msgs.push({role:'user',content:String(input)});
  const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),10*60*1000);
  const send=async(withMax)=>{const body={model:c.model,messages:msgs,stream:false};if(withMax&&opt.max)body.max_tokens=Math.min(opt.max,16000);return fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.key},body:JSON.stringify(body),signal:ctl.signal,credentials:'omit'})};
  try{
    let r=await send(true);
    if(!r.ok&&r.status===400)r=await send(false); // 有的模型不接受这么大的 max_tokens，去掉再试一次
    if(!r.ok){let m='';try{const j=await r.json();m=(j.error&&(j.error.message||j.error))||j.message||''}catch{}const e=new Error('接口返回 HTTP '+r.status+({401:'：key 不对或过期',403:'：没有权限',404:'：地址或模型不对',429:'：请求太多或额度不足'}[r.status]||'')+(m?'（'+String(m).slice(0,150)+'）':''));e.status=r.status;throw e}
    const j=await r.json();const t=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
    if(typeof t!=='string'||!t.trim())throw new Error('接口没有返回文字，请检查模型。');
    return t;
  }catch(e){if(e.name==='AbortError')throw new Error('等了 10 分钟还没写完，已停止。可以把目标字数调小再试。');if(e instanceof TypeError)throw new Error('网络请求失败：可能断网、地址不对，或服务商不允许网页直连。');throw e}
  finally{clearTimeout(timer)}
}
function char(){const list=contacts();const id=localStorage.getItem(CHAR_KEY);return list.find(c=>c.id===id)||null}
function me(){const p=comm().profile||{};return {name:p.name||'我',persona:p.persona||''}}
window.rain={ai,char:async()=>char(),charList:()=>contacts(),setChar:id=>{try{localStorage.setItem(CHAR_KEY,id)}catch{}},me,
  storage:{get:async k=>jget(k),set:async(k,v)=>{localStorage.setItem(k,JSON.stringify(v))}},
  theme:()=>null};
try{if(host&&host.snowLog)window.addEventListener('error',e=>host.snowLog('小剧场',e.message))}catch{}
})();
</script>

async function seedInitialMaterials(){if(!state.categories.includes('初始'))state.categories.unshift('初始');let changed=false;INITIAL_SEEDS.forEach(seed=>{if(!state.files.some(f=>f.id===seed.id)){state.files.push({...seed,category:'初始',created:Date.now()});changed=true}});if(changed)await persist()}
function purgeLegacyKKCode(){const codeBlob=t=>{const x=String(t||'');return /```[\s\S]*?```/i.test(x)&&x.length>500||(/(?:<!doctype\s+html|<html[\s\S]*<\/html>|<script[\s\S]*<\/script>|function\s+\w+\s*\(|document\.getElementById|const\s+\w+\s*=)/i.test(x)&&x.length>500)};state.files=(state.files||[]).filter(f=>!codeBlob(f.description));state.history=(state.history||[]).filter(h=>!codeBlob(h.content));state.kkChats=(state.kkChats||[]).filter(m=>{if(m.generated&&m.format&&m.format!=='纯文字小说素材'&&m.format!=='聊天 / 讨论')return false;return !codeBlob(m.materialText||m.text);})}
async function load(){try{let saved=window.rain?.storage?.get?await window.rain.storage.get(STORE):null;if(!saved){const raw=localStorage.getItem(STORE);if(raw)saved=JSON.parse(raw)}if(saved&&typeof saved==='object')state={...state,...saved}}catch(e){try{const raw=localStorage.getItem(STORE);if(raw)state={...state,...JSON.parse(raw)}}catch(e2){}};state.running=state.running||[];if(state.running.length){const now=Date.now();state.running.forEach(r=>state.history.push({...r,status:'error',content:'',error:'页面被关闭或刷新，这次生成中断了。可以点「重新生成」。',errorCode:'中断',created:r.created||now}));state.running=[]}state.kkChats=(state.kkChats||[]).slice(-2);state.historyTab=state.historyTab||'done';purgeLegacyKKCode();await seedInitialMaterials();try{state.theme=window.rain?.theme?.()||state.theme}catch{};document.documentElement.dataset.theme=state.theme;render()}
async function persist(){const data={files:state.files,categories:state.categories,history:state.history,running:state.running,kkChats:(state.kkChats||[]).slice(-2),historyTab:state.historyTab,kkNoticeSeen:state.kkNoticeSeen,userAvatar:state.userAvatar||'',kkLastMaterial:state.kkLastMaterial||''};try{if(window.rain?.storage?.set)await window.rain.storage.set(STORE,data);else localStorage.setItem(STORE,JSON.stringify(data))}catch(e){try{localStorage.setItem(STORE,JSON.stringify(data))}catch(e2){toast('保存失败：存储空间可能不足')}}}
function toast(msg){if(window.rain?.toast){try{window.rain.toast(msg);return}catch{}}const root=$('#toastRoot');root.innerHTML=`<div class="toast">${escapeHtml(msg)}</div>`;setTimeout(()=>root.innerHTML='',2200)}
function headerButtons(){ $('#plus').onclick=()=>wizard();$('#libraryBtn').onclick=()=>openLibrary();$('#generateBtn').onclick=()=>generationSetup();$('#themeBtn').onclick=async()=>{state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme;try{await window.rain?.storage?.set('theater_theme',state.theme)}catch{};render()}}
function render(){headerButtons();const v=$('#view');$('#pageDots').querySelectorAll('[data-dot]').forEach(d=>d.classList.toggle('active',d.dataset.dot===(state.page==='history'?'generated':state.page)));if(state.page==='library'){renderLibrary(v);return}if(state.page==='generated'){renderGenerated(v);return}if(state.page==='assistant'){renderKK(v);return}renderHistory(v)}

function generationSetup(){let defaultChar=state.char?.name||'点这里选择角色';modal(`<div class="sheethead"><span>✦ 生成小剧场</span><button class="close" id="closeG">×</button></div><div class="field"><label>选择角色</label><div class="input" id="charInfo" style="display:flex;align-items:center;gap:10px;cursor:pointer"><span>◉</span><span id="charName" style="flex:1">${escapeHtml(defaultChar)}</span><span>⌄</span></div><div id="charPick" class="hidden"></div><p class="hint">从雪落机「通讯」里的角色中选择，会读取他的人设作为剧情依据。</p></div><div class="field"><label>生成风格 / 趋势</label><input class="input" id="trend" placeholder="例如：温柔日常、轻悬疑、梦境感…" value="温馨日常"/></div><div class="field"><label>目标字数（默认 5000）</label><input class="input" type="number" id="targetWords" min="1000" max="20000" step="500" value="5000"/><p class="hint">每次生成可单独调整，建议 1000–20000 字。</p></div><div class="switcher"><button class="active" id="randomMode">随机生成</button><button id="customMode">自定义生成</button></div><div id="sourcePicker" class="hidden"><input class="input search" id="searchFiles" placeholder="⌕ 搜索素材或分类…"><div id="fileChoices"></div><div id="materialPreview" class="hidden"></div><p class="hint">搜索分类名可展开该分类，选择具体素材后生成。</p></div><button class="primary savebtn" id="startGen">开始生成</button>`);$('#closeG').onclick=closeModal;let mode='random',chosen=null,expandedCategory='';function drawChoices(){const q=$('#searchFiles').value.trim().toLowerCase();const cats=state.categories.filter(c=>c.toLowerCase().includes(q));let files=state.files.filter(f=>f.title.toLowerCase().includes(q)||(f.description||'').toLowerCase().includes(q)||(f.category||'').toLowerCase().includes(q));if(expandedCategory)files=state.files.filter(f=>f.category===expandedCategory);let html='';cats.forEach(c=>{const isOpen=expandedCategory===c;html+=`<div class="listrow" data-catopen="${escapeHtml(c)}"><div class="rowicon">▣</div><div class="rowtitle">${escapeHtml(c)}<small class="rowmeta">${state.files.filter(f=>f.category===c).length} 个素材</small></div><span>${isOpen?'⌄':'›  style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`:escapeHtml((c.name||'?').slice(0,1))}</div><div class="rowtitle">${escapeHtml(c.name)}<small class="rowmeta">${escapeHtml((c.persona||'没有填写人设').slice(0,40))}</small></div><span>${state.char&&state.char.id===c.id?'✓':''}</span></div>`).join('');box.classList.remove('hidden');box.querySelectorAll('[data-pickchar]').forEach(r=>r.onclick=()=>{const c=list.find(x=>x.id===r.dataset.pickchar);if(!c)return;state.char=c;window.rain?.setChar?.(c.id);$('#charName').textContent=c.name;box.classList.add('hidden');toast('已选择角色：'+c.name)})};$('#startGen').onclick=async()=>{if(!state.char){toast('先选择一个角色');return}if(mode==='custom'&&!chosen){toast('请选择一个素材文件');return}let file=mode==='random'?state.files[Math.floor(Math.random()*state.files.length)]:state.files.find(f=>f.id===chosen);if(!file){toast('素材库里还没有文件，请先创建');return}closeModal();beginGeneration(file,$('#trend')?.value||'自由发挥',state.char,null,Math.max(1000,Math.min(20000,Number($('#targetWords')?.value)||5000)))} }
function previewMaterial(id,target='#modalRoot'){const f=state.files.find(x=>x.id===id);if(!f)return;if(target==='#modalRoot'){modal(`<div class="sheethead"><span>素材预览 · ${escapeHtml(f.title)}</span><button class="close" id="closePreview">×</button></div><div class="materialPreview">${escapeHtml(f.description)}</div><button class="primary savebtn" id="editPreview">编辑素材</button>`);$('#closePreview').onclick=closeModal;$('#editPreview').onclick=()=>editFile(id)}else{const el=$(target);if(!el)return;el.innerHTML=`<div class="sectionline"><b>素材预览 · ${escapeHtml(f.title)}</b><button class="smallbtn" onclick="document.getElementById('materialPreview').classList.add('hidden')">收起</button></div><div class="materialPreview">${escapeHtml(f.description)}</div>`;el.classList.remove('hidden')}}
function beginGeneration(file,trend,charOverride=null,existingId=null,targetWords=5000){const char=charOverride||state.char||{};const item={id:existingId||crypto.randomUUID(),title:file.title,content:'',sourceId:file.id,charName:char.name||'当前角色',trend,targetWords,created:Date.now(),status:'running',cancelled:false};state.running.push(item);persist();state.page='generated';state.historyTab='running';render();runGeneration(item,file,char)}
async function runGeneration(item,file,char){const desc=String(file.description||'');const formatRule='统一输出纯文本：故事写成完整连贯正文；互动文游以文字选项和分支结果描述；表格、设定或代码类素材改用清晰的文字结构说明，禁止输出程序代码。';const prompt=`请参考角色设定和素材创作完整内容。正文不少于${item.targetWords||5000}字，尽量接近指定字数，不使用提纲或重复段落凑数。
角色名：${char?.name||'当前角色'}
角色人设：${char?.persona||''}
user（用户）的名字：${window.rain?.me?.().name||'我'}
素材里的 char 指上面的角色，user 指用户。
生成风格：${item.trend}
素材名称：${file.title}
素材完整描述：${file.description}
${formatRule}
如果素材描述要求HTML、CSS、JavaScript或其他代码，请将其需求改写为纯文字说明或剧情内容，不输出代码。
不要改变角色核心设定。直接输出成品，不解释创作过程。`;try{if(!window.rain?.ai)throw new Error('未检测到 rain.ai。请在雪落机内打开本应用，并确认 API 已连接。');let content=await window.rain.ai(prompt,{system:'你是小剧场生成助手。只输出纯文本故事或说明，不输出HTML、CSS、JavaScript或其他代码。',max:Math.min(18000,Math.max(6000,Math.ceil((item.targetWords||5000)*2.2)))});if(!content)throw new Error('AI返回空内容');if(item.cancelled)return;item.content=String(content);item.status='done';state.history.push({...item,status:'done',cancelled:false});state.running=state.running.filter(x=>x.id!==item.id);await persist();state.page='generated';state.historyTab='done';render();toast('小剧场生成完成')}catch(err){if(item.cancelled)return;item.status='error';item.error=String(err?.message||err||'未知错误');item.errorCode=err?.status||err?.code||'未知';state.running=state.running.filter(x=>x.id!==item.id);state.history.push({...item,status:'error',content:'',error:item.error,errorCode:item.errorCode});await persist();state.page='generated';state.historyTab='done';render();toast('生成失败，已保存错误详情')}}
async function stopGeneration(id){const item=state.running.find(x=>x.id===id);if(!item)return;item.cancelled=true;state.running=state.running.filter(x=>x.id!==id);await persist();render();toast('已停止；接口请求若已发出会在返回后丢弃结果')}
async function regenerateHistory(id){const h=state.history.find(x=>x.id===id);if(!h)return;const f=state.files.find(x=>x.id===h.sourceId);if(!f){toast('找不到原素材文件，无法重新生成');return}beginGeneration(f,h.trend||'自由发挥',state.char,id,h.targetWords||5000);state.history=state.history.filter(x=>x.id!==id);await persist()}
function readStory(id){let h=state.history.find(x=>x.id===id);if(!h)return;closeModal();const isErr=h.status==='error';$('#modalRoot').innerHTML=`<section class="reader" id="reader"><header class="readerhead"><button class="back" id="closeReader">‹ 返回</button><div class="readerTitle">${escapeHtml(h.title||'小剧场')}</div><div class="readerTools"><button class="smallbtn" id="readerRename">改名</button><button class="smallbtn" id="readerRegen">重生成</button></div></header><div class="hint" style="padding:12px 0">${escapeHtml(h.charName||'未命名角色')} · ${escapeHtml(h.trend||'')}</div>${isErr?`<div class="errorDetails"><b>生成失败 · 错误码 ${escapeHtml(h.errorCode||'未知')}</b><br>错误信息：${escapeHtml(h.error||'接口返回失败')}<br><br>可能原因：API未连接或权限未开放；网络中断或请求超时；模型服务暂时不可用；请求内容过长或格式不受支持；API额度/频率限制。建议先检查雪落机API连接与权限，再尝试重新生成。</div>`:`<article class="readerbody output">${escapeHtml(h.content||'（此条生成结果没有正文）')}</article>`}</section>`;$('#closeReader').onclick=closeModal;$('#readerRename').onclick=()=>{closeModal();renameHistory(id)};$('#readerRegen').onclick=()=>regenerateHistory(id)}
async function deleteHistory(id){if(!confirm('删除这篇已生成的小剧场？'))return;state.history=state.history.filter(x=>x.id!==id);await persist();render()}
function offerSaveMaterial(messageId){const m=state.kkChats.find(x=>x.id===messageId);if(!m||!m.generated)return;const body=String(m.materialText||'').trim();if(!body)return;const name=(body.match(/^#\s*(.+)$/m)||[])[1]||'kk生成素材';const host=document.querySelector(`[data-kk-save-host="${messageId}"]`);if(!host)return;host.innerHTML=`<div class="kkSaveInline"><select aria-label="保存分类">${state.categories.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}</select><button data-save-kk="${messageId}">加入素材库</button></div>`;host.querySelector('[data-save-kk]').onclick=async()=>{const category=host.querySelector('select').value||'未分类';state.files.push({id:crypto.randomUUID(),title:name.slice(0,50),description:body,category,created:Date.now(),source:'kk_generated'});m.savedToLibrary=true;await persist();host.innerHTML='<div class="kkCommentary">已保存到素材库啦。可在自定义生成里找到它 ( •̀ᴗ•́ )</div>';toast('已加入素材库')}}
function previewKKCode(messageId){const message=(state.kkChats||[]).find(m=>m.id===messageId);if(!message)return;const text=String(message.text||'');const code=(text.match(/```(?:html)?\s*([\s\S]*?)```/i)||[])[1]||text;const isHtml=/<html[\s\S]*<\/html>|<body[\s\S]*<\/body>|<script[\s\S]*<\/script>/i.test(code);if(!isHtml){toast('这份内容不是完整HTML，无法在预览窗运行。可以让kk按“完整HTML文游”格式重写。');return}modal(`<div class="sheethead"><span>互动文游预览</span><button class="close" id="closeKKPreview">×</button></div><iframe class="kkPreviewFrame" id="kkPreviewFrame" sandbox="allow-scripts" title="互动文游预览"></iframe>`);$('#closeKKPreview').onclick=closeModal;$('#kkPreviewFrame').srcdoc=code}
function renderKK(v){const msgs=(state.kkChats||[]).slice(-2),myAvatar=state.userAvatar||'';const avatar=user=>user?`<button class="kkAvatarPick" data-change-avatar title="点击更换头像">${myAvatar?`<img class="kkAvatar" src="${escapeHtml(myAvatar)}" alt="我的头像">`:`<span class="kkAvatar kkUserAvatar">我</span>`}<span class="kkAvatarCharm"><span class="charmCross">✝</span></span></button>`:`<span class="kkAvatarWrap"><img class="kkAvatar" src="${KK_AVATAR}" alt="kk"><span class="kkAvatarCharm"><span class="charmCross">✝</span></span></span>`;v.innerHTML=`<section class="kkPage"><div class="kkHead">${avatar(false)}<div><div class="kkTitle">kk <span style="font-size:12px;color:var(--sub)">（小剧场助手）</span></div><div class="kkSub">素材、剧情、格式都能聊。嗯，我会尽量帮上忙啦 (¬_¬)</div></div></div><div class="kkMsgs" id="kkMsgs">${msgs.map(m=>`<div class="kkMsg ${m.role==='user'?'user':''}">${avatar(m.role==='user')}<div class="kkBubble ${m.generated?'generated':''}">${m.generated?`<button class="copyGen" data-copy="${m.id}">复制素材</button>`:''}${escapeHtml(m.text)}${m.generated?`<div data-kk-save-host="${m.id}"></div>`:''}</div></div>`).join('')}</div><div class="kkInputBar"><input type="file" id="kkAvatarFile" accept="image/*" hidden><select class="kkFormat" id="kkFormat"><option value="聊天 / 讨论">聊天 / 讨论</option><option value="纯文字小说素材">纯文字小说素材</option></select><textarea id="kkInput" placeholder="和 kk 说说你想要什么素材…"></textarea><div class="kkSendRow"><button class="smallbtn" id="kkChangeAvatar">更换我的头像</button><button class="primary" id="kkSend">发送</button></div></div></section>`;$('#kkMsgs').scrollTop=$('#kkMsgs').scrollHeight;$('#kkAvatarFile').onchange=async()=>{const file=$('#kkAvatarFile').files?.[0];if(!file)return;try{state.userAvatar=await compressAvatar(file);$('#kkAvatarFile').value='';await persist();renderKK(v);toast('头像已更新')}catch(e){toast('头像读取失败')}};$('#kkChangeAvatar').onclick=()=>$('#kkAvatarFile').click();v.querySelectorAll('[data-change-avatar]').forEach(b=>b.onclick=()=>$('#kkAvatarFile').click());v.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const m=state.kkChats.find(x=>x.id===b.dataset.copy);if(m)copyText(m.materialText||m.text)});v.querySelectorAll('[data-kk-save-host]').forEach(host=>{const id=host.dataset.kkSaveHost,m=state.kkChats.find(x=>x.id===id);if(m&&m.generated&&!m.savedToLibrary)offerSaveMaterial(id);else if(m&&m.savedToLibrary)host.innerHTML='<div class=\"kkCommentary\">已加入素材库</div>'});$('#kkSend').onclick=async()=>{if(state.kkBusy)return;const text=$('#kkInput').value.trim();if(!text)return;state.kkBusy=true;const format=$('#kkFormat').value;state.kkChats.push({id:crypto.randomUUID(),role:'user',text});const system=`你是小剧场助手kk，略有傲娇但友善，适度使用颜文字。只帮助用户创作、讨论小剧场素材，不读取用户面具，不代替用户在主线中行动。仅支持纯文本，禁止输出HTML、CSS、JavaScript、程序代码、代码块。当前偏好格式：${format}。日常讨论时自然回答；当用户明确要求生成素材时，生成完整连贯正文，默认不少于5000字，用户在本次请求中指定字数则遵循指定字数。生成素材时必须用以下标记包住正文，标记外仅允许简短kk说明：<<<MATERIAL_START>>>素材正文<<<MATERIAL_END>>>。素材正文末尾附提示：该素材只保留最近一轮，请及时复制或加入素材库保存哦。`;const previous=state.kkChats.filter(m=>!m.pending).slice(-2).map(m=>({role:m.role==='user'?'user':'assistant',content:String(m.text||'')}));const pendingId=crypto.randomUUID();state.kkChats.push({id:pendingId,role:'assistant',text:'正在整理思路… ( •̀ᴗ•́ )',pending:true});$('#kkInput').value='';await persist();renderKK(v);try{if(!window.rain?.ai)throw new Error('没有检测到雪落机 API。请在雪落机中打开本应用并确认已配置 API。');let answer,firstError;try{answer=await window.rain.ai(previous,{system,max:3500})}catch(msgErr){firstError=msgErr}if(!answer){const fallback=previous.map(m=>`${m.role==='user'?'用户':'kk'}：${m.content}`).join('\n\n');try{answer=await window.rain.ai(fallback,{system,max:3500})}catch(textErr){throw new Error(`消息格式调用失败：${firstError?.message||firstError||'未知'}；文本回退也失败：${textErr?.message||textErr||'未知'}`)}}if(!answer)throw new Error('接口返回空内容，请检查模型配置、额度和网络。');const isMaterial=/(?:生成|写|创作|制作|来|给我|帮我|请).{0,12}(?:番外|小剧场|故事|小说|素材|剧本)|(?:番外|小剧场|故事|小说|素材|剧本).{0,8}(?:生成|创作|写|做)|写个(?:番外|故事|小说|小剧场)|给我(?:一个|一篇|一则)?(?:番外|故事|小说|小剧场)/i.test(text);let rawAnswer=String(answer),materialOnly=rawAnswer;if(isMaterial){const marked=rawAnswer.match(/<<<MATERIAL_START>>>([\s\S]*?)<<<MATERIAL_END>>>/);materialOnly=(marked?marked[1]:rawAnswer).trim();materialOnly=materialOnly.replace(/```(?:text|txt)?/gi,'').replace(/```/g,'').trim()}const output=isMaterial?materialOnly+'\n\n本次素材只保留最近一轮，请及时复制或加入素材库保存哦。':rawAnswer;state.kkChats=state.kkChats.filter(m=>m.id!==pendingId);state.kkChats.push({id:crypto.randomUUID(),role:'assistant',text:output,materialText:materialOnly,generated:isMaterial,format});if(isMaterial)state.kkLastMaterial=output;state.kkChats=state.kkChats.slice(-2);await persist();renderKK(v)}catch(e){state.kkChats=state.kkChats.filter(m=>m.id!==pendingId);state.kkChats.push({id:crypto.randomUUID(),role:'assistant',text:`连接失败：${e?.message||e}\n\n可能是 API 尚未连接、接口权限未开放、请求格式不兼容或额度不足。检查后再试吧 (¬_¬)`});state.kkChats=state.kkChats.slice(-2);await persist();renderKK(v)}finally{state.kkBusy=false}};if(!state.kkNoticeSeen){state.kkNoticeSeen=true;persist();modal(`<div class="sheethead"><span>kk 的使用说明</span><button class="close" id="kkNoticeClose">×</button></div><div class="kkNotice">kk 生成素材需要连接你在雪落机中配置的 API，会使用该接口的调用额度。模型响应速度与消耗取决于你选择的服务。知道了就开始吧，我可不是免费加班的 (¬_¬)</div><button class="primary savebtn" id="kkNoticeOk">知道了</button>`);$('#kkNoticeClose').onclick=closeModal;$('#kkNoticeOk').onclick=closeModal}}
function compressAvatar(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const n=150,canvas=document.createElement('canvas');canvas.width=n;canvas.height=n;const side=Math.min(img.width,img.height),x=(img.width-side)/2,y=(img.height-side)/2;canvas.getContext('2d').drawImage(img,x,y,side,side,0,0,n,n);resolve(canvas.toDataURL('image/jpeg',.68))};img.onerror=reject;img.src=String(reader.result)};reader.onerror=reject;reader.readAsDataURL(file)})}
function copyText(t){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>toast('已复制')).catch(()=>toast('复制失败'));else{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('已复制')}catch{toast('复制失败')}ta.remove()}}
// Swipe between library, generated archive, and KK assistant.
let startX=0;$('#view').addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});$('#view').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX;if(dx<-90&&state.page==='library'){state.page='history';state.historyTab='done';render()}else if(dx<-90&&(state.page==='history'||state.page==='generated')){state.page='assistant';render()}else if(dx>90&&state.page==='assistant'){state.page='history';state.historyTab='done';render()}else if(dx>90&&(state.page==='history'||state.page==='generated')){state.page='library';state.filter='全部';render()}},{passive:true});
// Try to read current character and user info when the host grants permission.
(async()=>{try{state.char=await window.rain?.char?.()||null}catch{};try{const storedTheme=await window.rain?.storage?.get('theater_theme');if(storedTheme==='dark'||storedTheme==='light')state.theme=storedTheme}catch{};document.documentElement.dataset.theme=state.theme;render()})();load();
</script></body></html>
